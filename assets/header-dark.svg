<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-label="Vayz — founder and lead engineer at Rush Labs. Low-latency execution and on-chain data infrastructure. FrenBot: $10M+ cumulative volume, 2,500+ users, under 30 ms mempool-to-submit, same-block inclusion."><title>Vayz — founder and lead engineer at Rush Labs. Low-latency execution and on-chain data infrastructure. FrenBot: $10M+ cumulative volume, 2,500+ users, under 30 ms mempool-to-submit, same-block inclusion.</title><style>
