" stroke="#1E3A2F"/><text xml:space="preserve" x="319.8" y="213.5" class="mono" font-size="12.5" fill="#9FB2A6" font-weight="400" text-anchor="middle" letter-spacing="0" >Firestore</text><text xml:space="preserve" x="460" y="215" class="sans" font-size="18" fill="#D0C090" font-weight="700" text-anchor="end" letter-spacing="0" >↗</text><polyline points="384,76 402,76 410,60 420,92 428,68 434,76 450,76" fill="none" stroke="#D0C090" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle class="fx ping pivot" style="animation-delay:1.35s" cx="454" cy="76" r="4" fill="none" stroke="#D0C090" stroke-width="1.5"/><circle cx="454" cy="76" r="3.5" fill="#D0C090"/></g></svg>