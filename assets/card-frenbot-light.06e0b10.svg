<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 256" width="500" height="256" role="img" aria-label="FrenBot: Mempool-driven execution engine in Rust and Go. Pre-built transactions, multi-endpoint submission. $10M+ volume · 2,500+ users · same-block inclusion."><title>FrenBot: Mempool-driven execution engine in Rust and Go. Pre-built transactions, multi-endpoint submission. $10M+ volume · 2,500+ users · same-block inclusion.</title><style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.fx{opacity:0}
.pivot{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion: reduce){ *{animation:none !important} }

.land{animation:land 5s ease-in-out infinite both}
@keyframes land{0%,30%,100%{opacity:1}15%{opacity:.15}}
.ping{animation:ping 3s ease-out infinite both}
@keyframes ping{0%{opacity:.9;transform:scale(1)}55%,100%{opacity:0;transform:scale(3)}}
.requote{animation:requote 5s ease-in-out infinite both}
