<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img" aria-label="Vayz, founder of Rush Labs. Systems engineer building fast, local AI search. Rust, Go, TypeScript and Python. Shipping production systems since 2021, 5 open-source releases, NVIDIA Inception member."><title>Vayz, founder of Rush Labs. Systems engineer building fast, local AI search. Rust, Go, TypeScript and Python. Shipping production systems since 2021, 5 open-source releases, NVIDIA Inception member.</title><style>
