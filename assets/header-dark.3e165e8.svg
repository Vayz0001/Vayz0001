<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 378" width="1000" height="378" role="img" aria-label="Vayz, founder and lead engineer at Rush Labs. Low latency execution and on-chain data infrastructure. Available for contract work. $10M+ cumulative volume, 2,500+ users, under 30 ms reaction time (100× faster), 40+ clients since 2021."><title>Vayz, founder and lead engineer at Rush Labs. Low latency execution and on-chain data infrastructure. Available for contract work. $10M+ cumulative volume, 2,500+ users, under 30 ms reaction time (100× faster), 40+ clients since 2021.</title><style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.fx{opacity:0}
.pivot{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion: reduce){ *{animation:none !important} }

