ont-size="14" fill="#F3EBDD" font-weight="400" text-anchor="start" letter-spacing="0" >› pool_create detected</text><text xml:space="preserve" x="582" y="162" class="mono" font-size="14" fill="#F3EBDD" font-weight="400" text-anchor="start" letter-spacing="0" >› prebuilt tx submitted</text><text xml:space="preserve" x="938" y="162" class="mono" font-size="14" fill="#D0C090" font-weight="700" text-anchor="end" letter-spacing="0" >&lt; 30 ms</text><text xml:space="preserve" x="582" y="192" class="mono" font-size="14" fill="#F3EBDD" font-weight="400" text-anchor="start" letter-spacing="0" >› included · same block</text><text xml:space="preserve" x="938" y="192" class="mono" font-size="15" fill="#6FD3A0" font-weight="700" text-anchor="end" letter-spacing="0" >✓</text><rect class="cur" x="582" y="209" width="9" height="17" fill="#D0C090"/><line x1="40" y1="290" x2="960" y2="290" stroke="#1E3A2F"/><text xml:space="preserve" x="40.0" y="332" class="sans" font-size="30" fill="#F3EBDD" font-weight="700" text-anchor="start" letter-spacing="0" >$10M+</text><text xml:space="preserve" x="40.0" y="354" class="sans" font-size="15" fill="#9FB2A6" font-weight="400" text-anchor="start" letter-spacing="0" >Cumulative volume</text><line x1="254" y1="308" x2="254" y2="352" stroke="#1E3A2F"/><text xml:space="preserve" x="270.0" y="332" class="sans" font-size="30" fill="#F3EBDD" font-weight="700" text-anchor="start" letter-spacing="0" >2,500+</text><text xml:space="preserve" x="270.0" y="354" class="sans" font-size="15" fill="#9FB2A6" font-weight="400" text-anchor="start" letter-spacing="0" >Users</text><line x1="484" y1="308" x2="484" y2="352" stroke="#1E3A2F"/><text xml:space="preserve" x="500.0" y="332" class="sans" font-size="30" fill="#F3EBDD" font-weight="700" text-anchor="start" letter-spacing="0" >&lt; 30 ms</text><text xml:space="preserve" x="500.0" y="354" class="sans" font-size="15" fill="#9FB2A6" font-weight="400" text-anchor="start" letter-spacing="0" >Reaction time · 100× fas